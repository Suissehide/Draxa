framework:
    secret: '%env(APP_SECRET)%'
    # Formulaires HTML avec <input name="_method" value="DELETE"> (suppression de patient)
    http_method_override: true
    handle_all_throwables: true

    session:
        cookie_secure: auto
        cookie_samesite: lax

    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
