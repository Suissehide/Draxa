networks:
  proxy:
    name: proxy
    external: true

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}:${VERSION:-latest}"
    container_name: "${APP_IMAGE_NAME}"
    ports:
      - '${PORT}:80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      retries: 3
      timeout: 3s
    environment:
      - APP_ENV=prod
      - APP_SECRET
      - DATABASE_URL
      - MAILER_URL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_IMAGE_NAME}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${APP_IMAGE_NAME}.entrypoints=https"
      - "traefik.http.routers.${APP_IMAGE_NAME}.tls=true"
      - "traefik.http.services.${APP_IMAGE_NAME}.loadbalancer.server.port=80"
    networks:
      - proxy
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: "${APP_IMAGE_NAME}-mysql"
    image: mysql:8.4
    command: --mysql-native-password=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
    networks:
      - proxy
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql:/var/lib/mysql

volumes:
  mysql:
    driver: local
