networks:
  proxy:
    name: proxy
    external: true

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${CONTAINER_REGISTRY_PREFIX}${APP_IMAGE_NAME}:${VERSION:-latest}"
    container_name: "${APP_IMAGE_NAME}"
    ports:
      - '${PORT}:80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      retries: 3
      timeout: 3s
    environment:
      - APP_ENV=prod
      - APP_SECRET
      - DATABASE_URL
      - MAILER_URL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_IMAGE_NAME}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${APP_IMAGE_NAME}.entrypoints=https"
      - "traefik.http.routers.${APP_IMAGE_NAME}.tls=true"
      - "traefik.http.services.${APP_IMAGE_NAME}.loadbalancer.server.port=80"
    networks:
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    container_name: "${APP_IMAGE_NAME}-postgres"
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB_NAME -U postgres"]
    networks:
      - proxy
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
    driver: local
